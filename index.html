<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package Downloader - SimpleTikTokMod</title>
  <style>
    :root {
      --bg: #000000;
      --card: #080808;
      --border: #1f1f1f;
      --border-focus: #333333;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --text-muted: #555555;
      --accent: #ffffff;
      --accent-inv: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Segoe UI Mono", "Roboto Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 24px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      fill: var(--text-primary);
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .tags {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      font-size: 0.65rem;
      background: #111111;
      border: 1px solid var(--border);
      padding: 2px 6px;
      color: var(--text-secondary);
      border-radius: 2px;
      text-transform: uppercase;
    }

    /* Action Panel */
    .action-panel {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    .btn-download {
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: var(--accent-inv);
      border: 1px solid var(--accent);
      border-radius: 2px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    .btn-download:hover {
      background: #e5e5e5;
      border-color: #e5e5e5;
    }

    .btn-download:active {
      background: #cccccc;
    }

    .btn-download svg {
      width: 16px;
      height: 16px;
      fill: var(--accent-inv);
    }

    .progress-wrapper {
      margin-top: 14px;
      display: none;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: #111111;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--text-primary);
      transition: width 0.1s linear;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    /* Specs Block */
    .specs {
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
    }

    .spec-label {
      color: var(--text-muted);
    }

    .spec-value {
      color: var(--text-secondary);
    }

    .hash-block {
      margin-top: 4px;
    }

    .hash-value {
      font-size: 0.65rem;
      color: var(--text-muted);
      background: #000000;
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 2px;
      word-break: break-all;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
      </div>
      <div class="meta">
        <div class="title" id="fileName">@SimpleTikTokMod 1.7 (47.0.3) Clone.apk</div>
        <div class="subtitle" id="packageName">com.ss.android.ugc.trill.clone</div>
        <div class="tags">
          <span class="tag">v1.7 (47.0.3)</span>
          <span class="tag">MOD</span>
          <span class="tag">CLONE</span>
        </div>
      </div>
    </div>

    <div class="action-panel">
      <button class="btn-download" id="dlBtn" onclick="executeDownload()">
        <svg viewBox="0 0 24 24">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        <span id="btnText">Download APK</span>
      </button>

      <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-info">
          <span id="statusLabel">CONNECTING MEDIAFIRE</span>
          <span id="percentLabel">0%</span>
        </div>
      </div>
    </div>

    <div class="specs">
      <div class="spec-row">
        <span class="spec-label">Target Package</span>
        <span class="spec-value">SimpleTikTokMod 1.7</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Base Build</span>
        <span class="spec-value">47.0.3</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Installation Type</span>
        <span class="spec-value">Standalone Clone</span>
      </div>
      <div class="hash-block">
        <div class="spec-label">Source Identifier</div>
        <div class="hash-value">mediafire.com/file/6j52p6tb71kruc6</div>
      </div>
    </div>
  </div>

  <script>
    const MEDIAFIRE_URL = "https://www.mediafire.com/file/6j52p6tb71kruc6/@SimpleTikTokMod+1.7+(47.0.3)+Clone.apk/file";

    function executeDownload() {
      const btn = document.getElementById("dlBtn");
      const btnText = document.getElementById("btnText");
      const wrapper = document.getElementById("progressWrapper");
      const bar = document.getElementById("progressBar");
      const statusLabel = document.getElementById("statusLabel");
      const percentLabel = document.getElementById("percentLabel");

      btn.style.pointerEvents = "none";
      btn.style.opacity = "0.4";
      wrapper.style.display = "block";

      let progress = 0;
      const timer = setInterval(() => {
        progress += Math.floor(Math.random() * 18) + 12;

        if (progress >= 100) {
          progress = 100;
          clearInterval(timer);

          bar.style.width = "100%";
          percentLabel.innerText = "100%";
          statusLabel.innerText = "REDIRECTING";
          btnText.innerText = "OPENING MEDIAFIRE";

          const anchor = document.createElement("a");
          anchor.href = MEDIAFIRE_URL;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);

          setTimeout(() => {
            btn.style.pointerEvents = "auto";
            btn.style.opacity = "1";
            btnText.innerText = "DOWNLOAD AGAIN";
            wrapper.style.display = "none";
            bar.style.width = "0%";
            statusLabel.innerText = "CONNECTING MEDIAFIRE";
            percentLabel.innerText = "0%";
          }, 2500);
        } else {
          bar.style.width = progress + "%";
          percentLabel.innerText = progress + "%";
        }
      }, 90);
    }
  </script>
</body>
</html>
